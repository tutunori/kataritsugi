default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_0900_ai_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("DB_USERNAME", "kataritsugi") %>
  password: <%= ENV.fetch("DB_PASSWORD", "secret") %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 3307) %>

development:
  <<: *default
  database: kataritsugi_development

test:
  <<: *default
  database: kataritsugi_test

production:
  <<: *default
  database: kataritsugi_production
  # 本番は必ず環境変数で上書きする
  username: <%= ENV.fetch("DB_USERNAME", "kataritsugi") %>
  password: <%= ENV.fetch("DB_PASSWORD", "secret") %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 3307) %>
